apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: home
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: ""
  ingress: "true"
  traefik: "true" 
  #settings.yaml: |
  #  providers:
  #    longhorn:
  #      url: https://longhorn.my.network
  custom.css: ""
  custom.js: ""
  bookmarks.yaml: |
    - Developer:
        - Github:
            - abbr: GH
              href: https://github.com/zacktay
  services.yaml: |
    - DNS and Security:
        - Pihole-1:
            href: https://pihole-1.teegeedoubleyou.work/admin/
            description: Primary Pi-hole
        - Pihole-2:
            href: https://pihole-2.teegeedoubleyou.work/admin/
            description: Secondary Pi-hole
        - Wireguard:
            href: https://wireguard.teegeedoubleyou.work
            description: Wireguard
        - Vault:
            href: https://vault.teegeedoubleyou.work
            description: Vault
    - Smart Home:
        - Home Assistant:
            href: https://ha.teegeedoubleyou.work
            description: Home Assistant
        - Scrypted:
            href: https://scrypted.teegeedoubleyou.work/endpoint/@scrypted/core/public/#/device
            description: Scrypted
    - Monitoring:
        - Headlamp:
            href: https://headlamp.teegeedoubleyou.work/c/main/
            description: Headlamp
        - Traefik:
            href: https://traefik.teegeedoubleyou.work
            description: Traefik
        - Uptime Kuma:
            href: https://uptime-kuma.teegeedoubleyou.work
            description: Uptime Kuma
        - Longhorn:
            href: https://longhorn.teegeedoubleyou.work
            description: Longhorn
        - Proxmox:
            href: https://proxmox.teegeedoubleyou.work
            description: Proxmox

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - search:
        provider: google
        target: _blank
  docker.yaml: ""