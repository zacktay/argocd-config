global:
  domain: ""
  ingressIP: ""

namespaceOverride: ""

ingress:
  enabled: true
  hostPrefix: "homepage"
  host: ""

config:
  bookmarks:
    - Developer:
        - Github:
            - icon: github.png
              href: https://github.com/zacktay/
              description: Github
        - Coursera:
            - icon: coursera.png
              href: https://www.coursera.org/programs/b10b-jan26-12m-3ry38/
              description: Coursera
        - Gemini:
            - icon: google.png
              href: https://gemini.google.com/
              description: Gemini
    - Social:
        - Gmail:
            - icon: gmail.png
              href: https://mail.google.com/
              description: Gmail
        - Reddit:
            - icon: reddit.png
              href: https://reddit.com/
              description: Reddit
        - AWS re:Post:
            - icon: aws.png
              href: https://repost.aws/
              description: AWS re:Post
    - Entertainment:
        - Plex:
            - icon: plex.png
              href: http://plex.{{ .Values.global.domain }}
              description: Plex Media Server
        - YouTube:
            - icon: youtube.png
              href: https://youtube.com/
              description: YouTube
        - Netflix:
            - icon: netflix.png
              href: https://netflix.com/
              description: Netflix

  services:
    - Infrastructure & Management:
        - Proxmox:
            icon: proxmox.png
            href: https://proxmox.{{ .Values.global.domain }}
            description: Hypervisor
        - Longhorn:
            icon: longhorn.png
            href: https://longhorn.{{ .Values.global.domain }}
            description: Block Storage
        - Headlamp:
            icon: headlamp.png
            href: https://headlamp.{{ .Values.global.domain }}/c/main/
            description: Kubernetes UI
        - Unifi:
            icon: unifi.png
            href: https://unifi.{{ .Values.global.domain }}/
            description: Unifi Management Console
    - Monitoring & Routing:
        - Traefik:
            icon: traefik.png
            href: https://traefik.{{ .Values.global.domain }}
            description: Reverse Proxy
        - Uptime Kuma:
            icon: uptime-kuma.png
            href: https://uptime-kuma.{{ .Values.global.domain }}
            description: Uptime Monitoring
    - DNS & Security:
        - Pihole-1:
            icon: pi-hole.png
            href: https://pihole-1.{{ .Values.global.domain }}/admin/
            description: Primary DNS
        - Pihole-2:
            icon: pi-hole.png
            href: https://pihole-2.{{ .Values.global.domain }}/admin/
            description: Secondary DNS
        - Vault:
            icon: hashicorp-vault.png
            href: https://vault.{{ .Values.global.domain }}
            description: Secrets Management
        - Wireguard:
            icon: wireguard.png
            href: https://wireguard.{{ .Values.global.domain }}
            description: VPN
    - Smart Home:
        - Home Assistant:
            icon: home-assistant.png
            href: https://ha.{{ .Values.global.domain }}
            description: Home Automation
        - Scrypted:
            icon: scrypted.png
            href: https://scrypted.{{ .Values.global.domain }}/endpoint/@scrypted/core/public/#/device
            description: NVR
    - Wiki & Apps:
        - Bookstack:
            icon: bookstack.png
            href: https://bookstack.{{ .Values.global.domain }}
            description: Documentation
        - Synology:
            icon: synology.png
            href: https://synology.{{ .Values.global.domain }}/
            description: File Sharing

  widgets:
    - search:
        provider: google
        target: _blank
        showSearchIcon: true
        focus: true
    - datetime:
        text_size: xl
        format:
          timeStyle: short
          dateStyle: full
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
