apiVersion: v1
kind: Service
metadata:
  labels:
    app: bookstack-mysql
  name: bookstack-mysql
spec:
  selector:
    app: bookstack-mysql
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: bookstack-web
  name: bookstack-web
spec:
  ports:
    - name: "8080"
      port: 8080
      targetPort: 8080
  selector:
    app: bookstack-web
