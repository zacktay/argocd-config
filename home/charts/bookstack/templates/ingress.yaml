apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bookstack-ingress
  namespace: {{ .Values.namespaceOverride | default .Release.Namespace }}
  annotations:
    cert-manager.io/cluster-issuer: "{{ .Values.global.clusterIssuer | default "letsencrypt-cluster-issuer" }}"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  rules:
    - host: {{ .Values.app.host | default (printf "bookstack.%s" (required "global.domain is required" .Values.global.domain)) }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bookstack-web
                port:
                  number: 8080
  tls:
    - hosts:
        - {{ .Values.app.host | default (printf "bookstack.%s" (required "global.domain is required" .Values.global.domain)) }}
      secretName: {{ .Values.app.tlsSecret }}
