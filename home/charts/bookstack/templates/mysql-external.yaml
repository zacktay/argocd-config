apiVersion: v1
kind: Service
metadata:
  name: bookstack-mysql
  labels:
    app: bookstack-mysql
spec:
  ports:
    - name: "mysql"
      port: 3306
      targetPort: 3306
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: bookstack-mysql
  labels:
    app: bookstack-mysql
    kubernetes.io/service-name: bookstack-mysql
addressType: IPv4
endpoints:
  - addresses:
      - 192.168.1.6
ports:
  - name: "mysql"
    port: 3306
    protocol: TCP
