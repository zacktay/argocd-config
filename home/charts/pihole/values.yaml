image:
  repository: pihole/pihole
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}


securityContext:
  capabilities:
    add:
    - CHOWN
    - NET_BIND_SERVICE
    - NET_RAW
    - NET_ADMIN
    - SYS_NICE
    - SYS_TIME

service:
  type: LoadBalancer
  ports:
    - port: 53
      name: dns-udp
      protocol: UDP
    - port: 53
      name: dns-tcp
      protocol: TCP
    - port: 80
      name: http
      protocol: TCP
  annotations:
    metallb.io/loadBalancerIPs: 192.168.1.53

ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    cert-manager.io/issuer: "home-ca-issuer"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  hosts:
    - host: pihole.home.lan
      paths: 
        - path: /
          pathType: Prefix
          backend:
            servicePort: 80

env:
  - name: TZ
    value: "America/Singapore"
  - name: FTLCONF_webserver_api_password
    valueFrom:
      secretKeyRef:
        name: pihole-secret
        key: pw
  - name: VIRTUAL_HOST
    value: "pihole.home.lan"

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 1000m
    memory: 1Gi

livenessProbe:
  exec:
    command:
      - nslookup
      - localhost
      - 127.0.0.1
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  exec:
    command:
      - nslookup
      - localhost
      - 127.0.0.1
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

replicaCount: 1

persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 1Gi
