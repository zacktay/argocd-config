global:
  domain: ""
  ingressIP: ""
  clusterIssuer: ""
  ingressClassName: ""

namespaceOverride: ""

service:
  type: ClusterIP
  port: 9000
  labels: {}
  annotations: {}
  namespace: kube-system
  additionalSpec: {}

ingress:
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cluster-issuer"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  host: ""
  hostPrefix: traefik
  issuer: letsencrypt-cluster-issuer
  tls: true
  tlsSecretName: traefik-tls-secret
