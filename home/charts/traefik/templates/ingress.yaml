apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: traefik-ingress
  namespace: kube-system
  annotations:
    cert-manager.io/issuer: "home-ca-issuer"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  tls:
   - hosts:
     - traefik.home.lan
     secretName: tls-traefik-cert
  ingressClassName: traefik
  rules:
    - host: traefik.home.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: traefik-dashboard
                port:
                  number: 9000