apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: plex-ui-cert
  namespace: home
spec:
  secretName: plex-ui-tls
  issuerRef:
    name: letsencrypt-cluster-issuer
    kind: ClusterIssuer
  dnsNames:
  - plex.teegeedoubleyou.work
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: plex-transport
  namespace: home
spec:
  insecureSkipVerify: true
  disableHTTP2: true
---
apiVersion: v1
kind: Service
metadata:
  name: plex-ui-backend
  namespace: home
spec:
  clusterIP: None
  ports:
  - name: https
    port: 32400
    targetPort: 32400
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: plex-ui-backend
  namespace: home
  labels:
    app: plex-ui
    kubernetes.io/service-name: plex-ui-backend
addressType: IPv4
endpoints:
  - addresses:
      - 192.168.1.5
ports:
  - name: "https"
    port: 32400
    protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: plex-ui-ingressroute
  namespace: home
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`plex.teegeedoubleyou.work`)
    kind: Rule
    services:
    - name: plex-ui-backend
      port: 32400
      scheme: https
      serversTransport: plex-transport
  tls:
    secretName: plex-ui-tls