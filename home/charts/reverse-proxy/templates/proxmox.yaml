apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: proxmox-ui-cert
  namespace: home
spec:
  secretName: proxmox-ui-tls
  issuerRef:
    name: letsencrypt-cluster-issuer
    kind: ClusterIssuer
  dnsNames:
  - proxmox.teegeedoubleyou.work
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: proxmox-transport
  namespace: home
spec:
  insecureSkipVerify: true
  disableHTTP2: true
---
apiVersion: v1
kind: Service
metadata:
  name: proxmox-ui-backend
  namespace: home
spec:
  clusterIP: None
  ports:
  - name: https
    port: 8006
    targetPort: 8006
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: proxmox-ui-backend
  namespace: home
  labels:
    app: proxmox-ui
    kubernetes.io/service-name: proxmox-ui-backend
addressType: IPv4
endpoints:
  - addresses:
      - 192.168.1.10
ports:
  - name: "https"
    port: 8006
    protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: proxmox-ui-ingressroute
  namespace: home
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`proxmox.teegeedoubleyou.work`)
    kind: Rule
    services:
    - name: proxmox-ui-backend
      port: 8006
      scheme: https
      serversTransport: proxmox-transport
  tls:
    secretName: proxmox-ui-tls