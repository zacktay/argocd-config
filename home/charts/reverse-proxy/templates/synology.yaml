apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: synology-ui-cert
  namespace: home
spec:
  secretName: synology-ui-tls
  issuerRef:
    name: letsencrypt-cluster-issuer
    kind: ClusterIssuer
  dnsNames:
  - synology.teegeedoubleyou.work
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: synology-transport
  namespace: home
spec:
  insecureSkipVerify: true
  disableHTTP2: true
---
apiVersion: v1
kind: Service
metadata:
  name: synology-ui-backend
  namespace: home
spec:
  clusterIP: None
  ports:
  - name: https
    port: 5001
    targetPort: 5001
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: synology-ui-backend
  namespace: home
  labels:
    app: synology-ui
    kubernetes.io/service-name: synology-ui-backend
addressType: IPv4
endpoints:
  - addresses:
      - 192.168.1.5
ports:
  - name: "https"
    port: 5001
    protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: synology-ui-ingressroute
  namespace: home
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`synology.teegeedoubleyou.work`)
    kind: Rule
    services:
    - name: synology-ui-backend
      port: 5001
      scheme: https
      serversTransport: synology-transport
  tls:
    secretName: synology-ui-tls