replicaCount: 1

image:
  repository: louislam/uptime-kuma
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 2000

securityContext:
  seccompProfile:
    type: RuntimeDefault
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: 3001
  annotations: {}

ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cluster-issuer"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  hosts:
    - host: uptime-kuma.teegeedoubleyou.work
      paths: 
        - path: /
          pathType: Prefix
          backend:
            servicePort: 80

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 700m
    memory: 1Gi

livenessProbe:
  httpGet:
    path: /
    port: 3001
readinessProbe:
  httpGet:
    path: /
    port: 3001

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 2Gi
