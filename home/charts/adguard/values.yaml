replicaCount: 1

image:
  repository: adguard/adguardhome
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 2000

securityContext:
  capabilities:
    add:
    - CHOWN
    - NET_BIND_SERVICE
    - NET_RAW
    - NET_ADMIN
    - SYS_NICE
    - SYS_TIME

service:
  type: LoadBalancer
  ports:
    - port: 53
      targetPort: dns-udp
      name: dns-udp
      protocol: UDP
    - port: 53
      targetPort: dns-tcp
      name: dns-tcp
      protocol: TCP
    - port: 80
      targetPort: http
      name: http
      protocol: TCP
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http-initial
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.1.54

ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    cert-manager.io/issuer: "home-ca-issuer"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  hosts:
    - host: adguard.home.lan
      paths: 
        - path: /
          pathType: Prefix
          backend:
            servicePort: 80

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 700m
    memory: 1Gi

livenessProbe:
  tcpSocket:
    port: 53
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /login
    port: 80
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 1Gi
