apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: letsencrypt-certificate
  namespace: {{ .Values.namespaceOverride | default .Release.Namespace }}
spec:
  secretName: letsencrypt-certificate-secret
  issuerRef:
    name: {{ .Values.global.clusterIssuer | default "letsencrypt-cluster-issuer" }}
    kind: ClusterIssuer
  commonName: {{ required "global.domain is required" .Values.global.domain }}
  dnsNames:
  - {{ required "global.domain is required" .Values.global.domain }}
