# Global values that can be accessed by all subcharts
global:
  storageClassName: longhorn

pihole-1:
  enabled: true
  replicaCount: 1
  strategyType: Recreate

  serviceDhcp:
    enabled: false

  serviceDns:
    loadBalancerIP: 192.168.1.53
    type: LoadBalancer
    annotations:
      metallb.universe.tf/allow-shared-ip: pihole-svc

  serviceWeb:
    loadBalancerIP: 192.168.1.53
    type: LoadBalancer
    annotations:
      metallb.universe.tf/allow-shared-ip: pihole-svc

  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/issuer: "home-ca-issuer"
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
    path: /
    pathType: ImplementationSpecific
    hosts:
      - pihole-1.home.lan
    tls:
     - secretName: tls-pihole-1-cert
       hosts:
         - pihole-1.home.lan

  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 1000m
      memory: 1Gi

  persistentVolumeClaim:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: "1Gi"
    storageClass: "longhorn"

  adminPassword: "snf1230z"

  # -- Use an existing secret for the admin password.
  admin:
    # -- If set to false admin password will be disabled, adminPassword specified above and the pre-existing secret (if specified) will be ignored.
    enabled: true
    # -- Specify an existing secret to use as admin password
    existingSecret: ""
    # -- Specify the key inside the secret to use
    passwordKey: "password"
    # -- Specify [annotations](docs/Values.md#admin.annotations) to be added to the secret
    annotations:
      # reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      # reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "external-dns"

  extraEnvVars:
    FTLCONF_dns_listeningMode: 'all'
    TZ: Asia/Singapore
    FTLCONF_dns_hosts: |
      192.168.2.3    homeassistant.local;
      192.168.1.21   longhorn.local;
      192.168.1.8    postgres.lan;
      192.168.1.20   adguard.home.lan;
      192.168.1.20   scrypted.home.lan;
      192.168.1.20   uptime-kuma.home.lan;
      192.168.1.20   vault.home.lan;
      192.168.1.20   traefik.home.lan;
      192.168.1.53   pihole-1.home.lan;
      192.168.1.54   pihole-2.home.lan;

  DNS1: "1.1.1.1"
  DNS2: "1.0.0.1"
    
  adlists:
    - https://reddestdream.github.io/Projects/MinimalHosts/etc/MinimalHostsBlocker/minimalhosts
    - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
    - https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/pro.plus.txt
    - https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/tif.medium.txt
  
  whitelist:
    - msmetrics.ws.sonos.com

  capabilities:
    add:
    - CHOWN
    - NET_BIND_SERVICE
    - NET_RAW
    - NET_ADMIN
    - SYS_NICE
    - SYS_TIME

  podDnsConfig:
    enabled: true
    policy: "None"
    nameservers:
      - 127.0.0.1
      - 1.1.1.1


