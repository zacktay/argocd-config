# Source: home/charts/bookstack/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: bookstack-mysql
  name: bookstack-mysql-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bookstack-mysql
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: bookstack-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:9.2
          env:
            - name: MYSQL_DATABASE
              value: bookstack
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bookstack-secret 
                  key: password
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bookstack-secret
                  key: root_password
            - name: MYSQL_USER
              value: bookstack
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: bookstack-mysql-data
          ports:
            - containerPort: 3306
      restartPolicy: Always
      volumes:
        - name: bookstack-mysql-data
          persistentVolumeClaim:
            claimName: bookstack-mysql-pvc
---
# Source: home/charts/bookstack/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: bookstack-web
  name: bookstack-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bookstack-web
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: bookstack-web
    spec:
      containers:
        - name: bookstack
          image: solidnerd/bookstack:25.5.2
          env:
            - name: APP_KEY
              valueFrom: 
                secretKeyRef:
                  name: bookstack-secret
                  key: app_key
            - name: APP_URL
              value: 'https://bookstack.custom-domain.local'
            - name: APP_DEBUG
              value: "false"
